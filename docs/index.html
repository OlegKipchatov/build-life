 .mobile-nav{left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;min-height:72px;padding:6px;align-items:stretch;border:1px solid rgba(255,255,255,.86);border-radius:38px;background:rgba(249,251,246,.97);box-shadow:0 10px 32px rgba(20,44,32,.15),0 2px 7px rgba(20,44,32,.06),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);isolation:isolate;z-index:3}
 .mobile-nav::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.6),transparent 35%,transparent 65%,rgba(255,255,255,.25));z-index:-1}
 .mobile-nav button{position:relative;flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 8px;border:0;border-radius:30px;background:transparent;color:#54665b;font-size:10px;font-weight:700;line-height:1.2;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}
 .mobile-nav button+button{margin-left:4px}
 .mobile-nav button span.glass-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 0 4px;font-size:inherit}
 .mobile-nav button .glass-icon svg{display:block;width:23px;height:23px}
 .mobile-nav button span.glass-label{font-size:10px;line-height:1.2;margin:0;display:block}
 .mobile-nav button.active{color:#244f39;background:linear-gradient(150deg,rgba(230,246,192,.9),rgba(202,225,161,.52));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(72,105,49,.08),0 2px 6px rgba(56,85,39,.07)}
 .mobile-nav button:active{transform:scale(.95)}
 .mobile-nav button:focus-visible{outline:2px solid var(--green);outline-offset:-3px}
 body.dark .mobile-nav{background:rgba(30,46,37,.97);border-color:rgba(226,244,225,.2);box-shadow:0 10px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(236,255,231,.18),inset 0 -1px 0 rgba(236,255,231,.04)}
 body.dark .mobile-nav::before{background:linear-gradient(140deg,rgba(233,255,220,.1),transparent 45%,rgba(233,255,220,.03))}
 body.dark .mobile-nav button{color:#b7c9bd}
 body.dark .mobile-nav button.active{color:#e0f6b2;background:linear-gradient(145deg,rgba(192,222,135,.23),rgba(151,185,94,.12));box-shadow:inset 0 1px 0 rgba(230,255,190,.28),0 2px 6px rgba(0,0,0,.1)}
 @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 .mobile-nav{background:rgba(249,251,246,.64);-webkit-backdrop-filter:blur(24px) saturate(175%);backdrop-filter:blur(24px) saturate(175%)}
 body.dark .mobile-nav{background:rgba(25,42,32,.72)}
 }
}
@media(prefers-reduced-motion:reduce){.mobile-nav button{transition:none}.mobile-nav button:active{transform:none}}
@media(prefers-reduced-transparency:reduce){.mobile-nav{background:#f9fbf6;-webkit-backdrop-filter:none;backdrop-filter:none}body.dark .mobile-nav{background:#1e2e25}}

/* Compact attribute progression and richer skill paths. */
.attribute-list{display:flex;flex-direction:column}
.attribute-row{display:flex;align-items:center;min-height:64px;padding:10px 0}
.attribute-row+.attribute-row{border-top:1px solid var(--line)}
.attribute-row .attribute-symbol{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;margin-right:12px}
.attribute-body{flex:1;min-width:0}
.attribute-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.attribute-heading strong{font-size:13px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.attribute-heading>span{flex:none;white-space:nowrap;margin-left:12px;font-size:11px;font-weight:800;color:var(--green)}
.attribute-body .rpg-bar{height:5px}
.skill-item{padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.skill-top{display:flex;align-items:center}
.skill-symbol{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;margin-right:12px;background:var(--soft);color:var(--green)}
.skill-symbol svg{width:24px;height:24px}
.skill-body{flex:1;min-width:0}
.skill-body>strong{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.skill-body .skill-links{line-height:1.5;margin-top:4px}
.skill-chevron{flex:none;width:18px;height:18px;margin-left:8px;color:var(--muted)}
.skill-progress{margin-top:13px}
.skill-progress .rpg-bar{height:6px;min-width:20px;display:block}
.skill-progress>small{font-variant-numeric:tabular-nums;font-size:10px}
.progress-unavailable{background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) 6px,transparent 6px,transparent 9px)}
.icon-picker{padding:0;margin:0 0 20px;border:0;min-width:0}
.icon-picker legend{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:9px}
.icon-picker>div{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:-3px}
.icon-picker label{position:relative;cursor:pointer;min-width:0;margin:3px}
.icon-picker input{position:absolute;width:1px;height:1px;opacity:0}
.icon-picker label>span{display:grid;place-items:center;min-height:44px;border-radius:10px;background:var(--soft);color:var(--green);border:2px solid transparent}
.icon-picker svg{width:23px;height:23px}
.icon-picker input:checked+span{border-color:var(--green);background:var(--lime);color:#284b3c}
.icon-picker input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}

==='flexible'?fd.get('flexible_repeat'):fd.get('repeat_mode');if(repeat==='weekly'&&!days.length){alert(data.language==='en'?'Choose at least one day of the week':'Выбери хотя бы один день недели');return}let item={name:String(fd.get('name')).trim(),difficulty:fd.get('difficulty'),repeat,scheduleMode:mode,date:fd.get('date')||'',days,milestone:fd.get('milestone'),stepId:fd.get('stepId')||'',attribute:fd.get('attribute'),skill:fd.get('skill')};MilestoneDomain.linkTask(data,item,item.milestone,item.stepId);if(item.stepId)expandedSteps.add(item.stepId);let old=data.tasks.find(x=>x.id===f.dataset.id);if(old)Object.assign(old,item);else data.tasks.push({id:uid(),status:'active',completions:[],...item})}save();if(f.id==='character-name-form')openCharacterSettings();else close();render()});window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(data.theme==='system'){const draft=$('#username')?.value;render();if(draft!==undefined)$('#username').value=draft}});document.addEventListener('keydown',e=>{if(e.key==='Tab'&&$('#modal').firstElementChild){const controls=Array.from($('#modal').querySelectorAll('button,input,select,textarea,summary,[tabindex="0"]')).filter(x=>!x.disabled&&x.getClientRects().length);const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.key==='Escape'){const expanded=document.querySelector('.multiselect[open]');if(expanded){expanded.open=false;expanded.querySelector('summary').focus();return}hideMenu();close()}});save();const currentGoal=()=>data.milestones.find(m=>m.id===milestoneId);
const refreshGoal=(focusSelector)=>{const y=window.scrollY;render();window.scrollTo(0,y);if(focusSelector)document.querySelector(focusSelector)?.focus({preventScroll:true})};
const openStep=id=>{const m=currentGoal();if(!m||stateOf(m)==='archived')return;const step=m.steps.find(s=>s.id===id);modal(ui(step?'Изменить шаг':'Новый шаг',step?'Edit step':'New step'),`<form id="step-form" data-id="${id||''}" data-goal="${m.id}"><div class="field"><label for="step-name">${ui('НАЗВАНИЕ ШАГА','STEP TITLE')}</label><input id="step-name" name="name" required maxlength="120" value="${esc(step?.name||'')}" placeholder="${ui('Конкретный результат','Concrete outcome')}"></div><div class="modal-actions"><button class="btn secondary" type="button" data-close>Отмена</button><button class="btn">${ui('Сохранить','Save')}</button></div></form>`)};
const closeQuickMenu=()=>{document.querySelectorAll('.goal-quick-menu,.step-menu').forEach(x=>x.remove());document.querySelector('[data-goal-fab]')?.setAttribute('aria-expanded','false')};
document.addEventListener('click',e=>{
 const el=e.target.closest('button');
 if(!e.target.closest('.goal-fab-wrap,.step-menu')&&!el?.hasAttribute('data-step-menu'))closeQuickMenu();
 if(!el)return;const m=currentGoal();
 if(el.hasAttribute('data-goal-fab')){const open=el.getAttribute('aria-expanded')==='true';closeQuickMenu();if(!open){el.setAttribute('aria-expanded','true');el.insertAdjacentHTML('beforebegin',`<div class="goal-quick-menu" role="menu"><button role="menuitem" data-new-step>☷ ${ui('Новый шаг','New step')}</button><button role="menuitem" data-goal-task>＋ ${ui('Новая задача','New task')}</button></div>`);document.querySelector('.goal-quick-menu button')?.focus()}return}
 if(el.hasAttribute('data-new-step')){closeQuickMenu();openStep();return}
 if(el.hasAttribute('data-goal-task')||el.dataset.stepTask){closeQuickMenu();openTask(undefined,{milestone:m.id,stepId:el.dataset.stepTask||''});return}
 if(el.dataset.stepExpand){const id=el.dataset.stepExpand;expandedSteps.has(id)?expandedSteps.delete(id):expandedSteps.add(id);refreshGoal(`[data-step-expand="${id}"]`);return}
 if(el.hasAttribute('data-step-order')){reorderSteps=!reorderSteps;refreshGoal('[data-step-order]');return}
 if(el.dataset.stepToggle){const step=m?.steps.find(s=>s.id===el.dataset.stepToggle);if(step&&MilestoneDomain.setStep(m,step.id,!step.completed,new Date().toISOString())){save();refreshGoal(`[data-step-toggle="${step.id}"]`)}return}
 if(el.dataset.stepMove){const [id,delta]=el.dataset.stepMove.split(':');if(MilestoneDomain.moveStep(m,id,Number(delta))){save();refreshGoal(`[data-step-expand="${id}"]`)}return}
 if(el.dataset.stepMenu){const id=el.dataset.stepMenu;closeQuickMenu();el.parentElement.insertAdjacentHTML('beforeend',`<div class="step-menu dropdown" role="menu"><button role="menuitem" data-edit-step="${id}">✎ ${ui('Изменить','Edit')}</button><button role="menuitem" class="danger-text" data-remove-step="${id}">⌫ ${ui('Удалить','Delete')}</button></div>`);document.querySelector('.step-menu button')?.focus();return}
 if(el.dataset.editStep){closeQuickMenu();openStep(el.dataset.editStep);return}
 if(el.dataset.removeStep){const id=el.dataset.removeStep;closeQuickMenu();modal(ui('Удалить шаг?','Delete step?'),`<p>${ui('Связанные задачи останутся в общем списке и в этой вехе без шага.','Linked tasks will remain in your task list and milestone without a step.')}</p><div class="modal-actions"><button class="btn secondary" data-close>Отмена</button><button class="btn danger" data-confirm-step="${id}">${ui('Удалить','Delete')}</button></div>`);return}
 if(el.dataset.confirmStep){if(MilestoneDomain.removeStep(data,m,el.dataset.confirmStep)){save();close();refreshGoal()}return}
 if(el.dataset.goalComplete){if(m&&MilestoneDomain.complete(m,new Date().toISOString())){goalNotice=ui('Веха достигнута: ','Milestone achieved: ')+m.name;save();milestoneView='completed';milestoneId=null;render();document.querySelector('.achievement')?.scrollIntoView({block:'nearest'})}return}
 if(el.hasAttribute('data-dismiss-goal')){goalNotice='';render()}
});
document.addEventListener('submit',e=>{if(e.target.id!=='step-form')return;e.preventDefault();const f=e.target,m=data.milestones.find(x=>x.id===f.dataset.goal);if(!m||stateOf(m)==='archived')return;const name=String(new FormData(f).get('name')||'').trim();if(!name)return;const step=m.steps.find(x=>x.id===f.dataset.id);if(step)step.name=name;else MilestoneDomain.addStep(m,uid(),name);save();close();refreshGoal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeQuickMenu();document.querySelector('[data-goal-fab]')?.focus({preventScroll:true})}});
render();
</script></body></html>
